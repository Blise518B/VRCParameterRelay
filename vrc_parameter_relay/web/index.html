<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Avatar Remote</title>
<link rel="icon" type="image/png" href="static/favicon.png">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="dot" id="statusDot"></span>
    <h1 id="boardName">Avatar Remote</h1>
    <button id="nameBtn" class="name-btn" type="button">✎ set name</button>
  </div>
  <div class="sub" id="statusText">connecting…</div>
</header>

<main id="board" class="board"></main>

<div id="overlay" class="overlay hidden">
  <div class="overlay-card" id="overlayText"></div>
</div>

<div id="nameGate" class="overlay hidden">
  <div class="overlay-card">
    <p class="gate-text">The host wants to know who's here —<br>pick a name to join.</p>
    <input id="gateInput" type="text" maxlength="24" placeholder="Your name"
           autocomplete="nickname">
    <button id="gateBtn" type="button">Join</button>
  </div>
</div>

<footer>VRC Parameter Relay · made by
  <a href="https://github.com/Blise518B" target="_blank" rel="noopener">Blise518B</a>
</footer>
<script src="static/app.js"></script>
</body>
</html>
