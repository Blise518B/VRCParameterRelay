<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="30">
<title>VRC Parameter Relay — not running</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; background: #0a0c0a; color: #c9d4cc;
    font-family: "Segoe UI", system-ui, sans-serif; padding: 20px; }
  .box { width: 100%; max-width: 380px; border: 1px solid #1e2a24;
    border-radius: 14px; padding: 26px 24px; background: #0e120f;
    text-align: center; }
  h1 { margin: 0 0 10px; font-size: 19px; color: #ffb454; }
  p { margin: 0 0 8px; font-size: 13px; color: #7c8a84; line-height: 1.5; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: #ffb454; margin-right: 7px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }
  .status { margin-top: 18px; font-size: 12px; color: #56655e; }
</style>
</head>
<body>
<div class="box">
  <h1>Not running right now</h1>
  <p>The host hasn't started the relay yet.</p>
  <p>Leave this page open — it loads the board by itself the moment it
    comes up.</p>
  <div class="status"><span class="dot"></span><span id="s">checking…</span></div>
</div>
<script>
"use strict";
var tries = 0;
function look() {
  tries += 1;
  document.getElementById("s").textContent =
    "checking… (" + tries + ")";
  fetch("/health", { cache: "no-store" })
    .then(function (r) { if (r.ok) { location.reload(); } })
    .catch(function () { /* still down; the timer keeps going */ });
}
setInterval(look, 5000);
look();
</script>
</body>
</html>
